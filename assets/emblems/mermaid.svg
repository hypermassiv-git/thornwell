<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Mermaid: fluked tail with scales (line art) -->
  <g stroke="#f4e9c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- two flukes fanning out at the top -->
    <path d="M100 100 C88 72 72 50 52 44 C48 66 58 90 92 106"/>
    <path d="M100 100 C112 72 128 50 148 44 C152 66 142 90 108 106"/>
    <!-- tail body tapering to a point -->
    <path d="M92 106 C91 126 93 144 100 162 C107 144 109 126 108 106"/>
  </g>
  <!-- scale rows on the lower body -->
  <g stroke="#f4e9c8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M92 120 q8 8 16 0"/>
    <path d="M94 136 q6 7 12 0"/>
    <path d="M97 151 q3 5 6 0"/>
  </g>
</svg>
