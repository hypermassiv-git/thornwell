<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pixie: star wand with leaves and sparkles (line art) -->
  <g stroke="#f4e9c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- star -->
    <path d="M64 40 L68.7 53.5 L83 53.8 L71.6 62.5 L75.8 76.2 L64 68 L52.2 76.2 L56.4 62.5 L45 53.8 L59.3 53.5 Z"/>
    <!-- wand stick -->
    <path d="M68 72 L112 152"/>
    <!-- two leaves (clear almond shapes) -->
    <path d="M154 82 C131 88 121 107 124 132 C148 124 160 103 154 82 Z"/>
    <path d="M133 114 C117 120 109 134 113 152 C133 146 143 130 133 114 Z"/>
    <!-- leaf veins -->
    <path d="M141 96 L134 124" stroke-width="3"/>
    <path d="M125 126 L121 146" stroke-width="3"/>
  </g>
  <!-- sparkles -->
  <g stroke="#f4e9c8" stroke-width="4.5" stroke-linecap="round">
    <path d="M99 42 v13 M92.5 48.5 h13"/>
    <path d="M56 132 v10 M51 137 h10"/>
  </g>
</svg>
